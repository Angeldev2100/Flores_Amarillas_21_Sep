<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Feliz 21 de Septiembre <3</title>
    <link rel="icon" href="Flor_icono.ico" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Arial', system-ui, sans-serif;
            background: #060b18;
            transition: background 2.5s ease-in-out;
            position: relative;
        }

        /* ============================================
           CIELO CON ESTRELLAS
           ============================================ */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70%;
            z-index: 0;
            transition: opacity 2.5s ease-in-out;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 4px rgba(255, 255, 255, 0.8);
        }

        /* ============================================
           ARBUSTOS MINIMALISTAS (responsive con %)
           ============================================ */
        .bushes-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 32vh;
            min-height: 160px;
            max-height: 280px;
            z-index: 2;
            pointer-events: none;
            overflow: hidden;
        }

        .bush {
            position: absolute;
            bottom: 0;
            transform-origin: bottom center;
            animation: bushSway 6s infinite ease-in-out;
            transition: filter 2.5s ease;
            will-change: transform;
        }

        .bush svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        .bush-back {
            z-index: 1;
            opacity: 0.6;
            filter: brightness(0.4);
        }
        body.day .bush-back { filter: brightness(0.8) saturate(1.05); }

        .bush-mid {
            z-index: 2;
            opacity: 0.85;
            filter: brightness(0.55);
        }
        body.day .bush-mid { filter: brightness(0.95) saturate(1.1); }

        .bush-front {
            z-index: 3;
            filter: brightness(0.7);
        }
        body.day .bush-front { filter: brightness(1.05) saturate(1.15); }

        @keyframes bushSway {
            0%, 100% { transform: rotate(-1deg) translateX(0); }
            50% { transform: rotate(1deg) translateX(1px); }
        }

        /* Hierba frontal */
        .grass-front {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: clamp(25px, 6vh, 60px);
            z-index: 5;
            pointer-events: none;
            background: linear-gradient(to top, #0a1a0e 0%, transparent 100%);
            transition: background 2.5s ease;
        }
        body.day .grass-front {
            background: linear-gradient(to top, #3d5a2a 0%, transparent 100%);
        }

        .grass-blade {
            position: absolute;
            bottom: 0;
            width: 2px;
            background: #0a1a0e;
            border-radius: 50% 50% 0 0;
            transform-origin: bottom center;
            transition: background 2.5s ease;
            animation: sway 5s infinite ease-in-out;
        }
        body.day .grass-blade { background: #4a6a32; }

        @keyframes sway {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }

        /* ============================================
           JARDÍN DE FLORES
           ============================================ */
        .garden {
            position: fixed;
            inset: 0;
            z-index: 4;
            pointer-events: none;
            overflow: hidden;
        }

        .garden-flower {
            position: absolute;
            opacity: 0;
            transform: scale(0) rotate(-30deg);
            animation: bloom 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            filter: drop-shadow(0 0 10px rgba(255, 217, 102, 0.7));
            transition: filter 2.5s ease;
            will-change: transform, opacity;
        }

        @keyframes bloom {
            0% {
                opacity: 0;
                transform: scale(0) translateY(20px) rotate(-45deg);
            }
            60% {
                opacity: 1;
                transform: scale(1.15) translateY(-3px) rotate(8deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0) rotate(0deg);
            }
        }

        .garden-flower.swaying {
            animation: bloom 1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
                       flowerSway 4s infinite ease-in-out 1s;
        }

        @keyframes flowerSway {
            0%, 100% { transform: scale(1) rotate(-3deg); }
            50% { transform: scale(1) rotate(3deg); }
        }

        body.day .garden-flower {
            filter: drop-shadow(0 0 14px rgba(255, 179, 71, 0.8));
        }

        /* ============================================
           CONTENEDOR PRINCIPAL
           ============================================ */
        .container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 20px;
            text-align: center;
            pointer-events: none;
        }

        .title {
            font-size: clamp(1.4rem, 6.5vw, 3rem);
            color: #fff9c4;
            text-shadow: 0 0 18px #ffd966, 0 0 35px #ffb347;
            margin-bottom: 8px;
            font-weight: 800;
            letter-spacing: 1px;
            transition: color 2.5s ease, text-shadow 2.5s ease;
        }

        /* ============================================
           FLOR PRINCIPAL CON ANIMACIÓN DE CLIC
           ============================================ */
        .flower {
            cursor: pointer;
            pointer-events: auto;
            transition: filter 0.5s ease;
            filter: drop-shadow(0 0 30px #ffd966);
            margin: 10px 0;
            animation: mainFlowerSway 5s infinite ease-in-out;
            transform-origin: center center;
        }

        @keyframes mainFlowerSway {
            0%, 100% { transform: rotate(-2deg) translateY(0); }
            50% { transform: rotate(2deg) translateY(-5px); }
        }

        .flower:hover {
            filter: drop-shadow(0 0 45px #ffe066);
        }

        /* 🎯 ANIMACIÓN AL HACER CLIC: giro leve + rebote */
        .flower.pop {
            animation: spinRebound 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
        }

        @keyframes spinRebound {
            0%   { transform: scale(1) rotate(0deg); }
            25%  { transform: scale(1.15) rotate(-15deg); }
            50%  { transform: scale(1.1) rotate(12deg); }
            70%  { transform: scale(1.05) rotate(-6deg); }
            85%  { transform: scale(1.02) rotate(3deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .flower-svg {
            width: clamp(110px, 38vw, 200px);
            height: auto;
            display: block;
        }

        /* ============================================
           MENSAJES (los 8 se quedan cargados)
           ============================================ */
        .messages {
            margin-top: 12px;
            min-height: 50px;
            max-height: clamp(200px, 40vh, 380px);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 10px;
            scrollbar-width: thin;
            scrollbar-color: #ffd966 transparent;
            pointer-events: auto;
            background: rgba(0, 0, 0, 0.1);
            border-radius: 15px;
            transition: background 2.5s ease;
        }

        body.day .messages {
            background: rgba(255, 255, 240, 0.2);
        }

        .messages::-webkit-scrollbar { width: 4px; }
        .messages::-webkit-scrollbar-thumb { background: #ffd966; border-radius: 10px; }

        .message {
            background: rgba(255, 255, 200, 0.12);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 220, 100, 0.4);
            border-radius: 25px;
            padding: clamp(7px, 1.3vh, 12px) clamp(14px, 3vw, 22px);
            font-size: clamp(0.75rem, 3.2vw, 1.05rem);
            color: #fff4d6;
            max-width: 90vw;
            text-align: left;
            line-height: 1.35;
            border-left: 4px solid #ffd966;
            animation: appear 0.6s ease forwards;
            transition: background 2.5s ease, color 2.5s ease, border-color 2.5s ease;
            flex-shrink: 0;
        }

        @keyframes appear {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============================================
           NOTA PERSONAL
           ============================================ */
        .note {
            position: fixed;
            bottom: clamp(4px, 1vh, 14px);
            left: 0;
            right: 0;
            text-align: center;
            font-size: clamp(0.55rem, 2.5vw, 0.85rem);
            color: #d4c9a8;
            z-index: 20;
            font-style: italic;
            transition: color 2.5s ease;
            pointer-events: none;
            padding: 0 8px;
        }

        .note span {
            background: rgba(0,0,0,0.5);
            padding: 5px 12px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 200, 0.15);
            transition: all 2.5s ease;
            display: inline-block;
            max-width: 92vw;
        }

        /* ============================================
           CONTADOR
           ============================================ */
        .counter {
            position: fixed;
            top: 10px;
            left: 10px;
            font-size: clamp(0.6rem, 2.3vw, 0.8rem);
            color: rgba(255, 255, 200, 0.6);
            background: rgba(0,0,0,0.35);
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 700;
            transition: all 2.5s ease;
            pointer-events: none;
            letter-spacing: 0.5px;
            z-index: 25;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        /* ============================================
           REPRODUCTOR DE MÚSICA
           ============================================ */
        .music-player {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,0,0,0.4);
            padding: 6px 10px 6px 6px;
            border-radius: 30px;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 200, 0.2);
            transition: all 2.5s ease;
        }

        body.day .music-player {
            background: rgba(255, 255, 240, 0.7);
            border-color: rgba(135, 206, 235, 0.5);
        }

        .music-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FFD966, #F5B700);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #4a3200;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 0 12px rgba(255, 217, 102, 0.5);
            padding: 0;
            pointer-events: auto;
            flex-shrink: 0;
        }

        .music-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255, 217, 102, 0.8);
        }

        .music-btn:active {
            transform: scale(0.95);
        }

        .music-btn svg {
            width: 16px;
            height: 16px;
            fill: #4a3200;
        }

        .music-volume {
            width: 60px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 200, 0.3);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
            pointer-events: auto;
        }

        .music-volume::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #FFD966;
            cursor: pointer;
            box-shadow: 0 0 6px rgba(255, 217, 102, 0.8);
        }

        .music-volume::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #FFD966;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 6px rgba(255, 217, 102, 0.8);
        }

        body.day .music-volume {
            background: rgba(70, 50, 20, 0.25);
        }

        /* ===== ESTILOS DE DÍA ===== */
        body.day .title {
            color: #1e3a5f;
            text-shadow: 0 0 12px #87ceeb, 0 0 25px #b0e0ff;
        }

        body.day .message {
            background: rgba(255, 255, 245, 0.9);
            color: #2a3a4a;
            border-color: #87ceeb;
            border-left-color: #4a90d9;
        }

        body.day .note { color: #3a4a5a; }
        body.day .note span {
            background: rgba(255, 255, 240, 0.8);
            border-color: #87ceeb;
        }
        body.day .counter {
            color: rgba(30, 60, 100, 0.8);
            background: rgba(255, 255, 240, 0.6);
        }
        body.day .flower {
            filter: drop-shadow(0 0 45px #ffb347) brightness(1.05);
        }

        /* ============================================
           AJUSTES PARA MÓVIL
           ============================================ */
        @media (max-width: 480px) {
            .bushes-container {
                height: 26vh;
                min-height: 130px;
                max-height: 200px;
            }
            .bush-back {
                display: none;
            }
            .message {
                border-radius: 20px;
                padding: 8px 16px;
                font-size: 0.78rem;
            }
            .flower-svg {
                width: clamp(100px, 35vw, 150px);
            }
            .messages {
                max-height: 32vh;
                gap: 6px;
            }
            .music-player {
                padding: 5px 8px 5px 5px;
                gap: 6px;
            }
            .music-btn {
                width: 28px;
                height: 28px;
            }
            .music-btn svg {
                width: 13px;
                height: 13px;
            }
            .music-volume {
                width: 45px;
            }
        }

        @media (max-height: 500px) {
            .flower-svg {
                width: clamp(80px, 22vw, 120px);
            }
            .title {
                font-size: clamp(1.1rem, 5vw, 1.8rem);
                margin-bottom: 3px;
            }
            .messages {
                max-height: 28vh;
            }
            .bushes-container {
                height: 24vh;
                min-height: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    
    <div class="bushes-container" id="bushesContainer"></div>
    <div class="grass-front" id="grassFront"></div>

    <div class="garden" id="garden"></div>

    <div class="counter" id="counter">💛 0 / 8</div>

    <!-- 🎵 REPRODUCTOR DE MÚSICA -->
    <div class="music-player">
        <button class="music-btn" id="musicBtn" aria-label="Reproducir música">
            <svg id="musicIcon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 5v14l11-7z"/>
            </svg>
        </button>
        <input type="range" class="music-volume" id="musicVolume" min="0" max="1" step="0.01" value="0.5" aria-label="Volumen">
    </div>

    <!-- 🎵 Cambia "TU_CANCION.mp3" por el nombre de tu archivo -->
    <audio id="bgMusic" loop preload="auto">
        <source src="music/Floricienta - Flores Amarillas (Letra).mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <h1 class="title">Feliz 21 de Septiembre &lt;3</h1>

        <div class="flower" id="flowerBtn">
            <svg class="flower-svg" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <radialGradient id="petalGrad" cx="50%" cy="30%" r="70%">
                        <stop offset="0%" stop-color="#FFF3B0" />
                        <stop offset="45%" stop-color="#FFD966" />
                        <stop offset="100%" stop-color="#F5B700" />
                    </radialGradient>
                    <radialGradient id="centerGrad" cx="40%" cy="35%" r="70%">
                        <stop offset="0%" stop-color="#FFE082" />
                        <stop offset="50%" stop-color="#FFB347" />
                        <stop offset="100%" stop-color="#C97B00" />
                    </radialGradient>
                    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
                        <feGaussianBlur in="SourceAlpha" stdDeviation="4" />
                        <feOffset dx="0" dy="3" result="offsetblur" />
                        <feComponentTransfer>
                            <feFuncA type="linear" slope="0.35" />
                        </feComponentTransfer>
                        <feMerge>
                            <feMergeNode />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>
                    <filter id="outerGlow" x="-50%" y="-50%" width="200%" height="200%">
                        <feGaussianBlur stdDeviation="5" result="blur" />
                        <feMerge>
                            <feMergeNode in="blur" />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>
                </defs>

                <g filter="url(#outerGlow)">
                    <g filter="url(#softShadow)">
                        <ellipse cx="110" cy="68" rx="22" ry="48" fill="url(#petalGrad)" transform="rotate(0 110 110)" />
                        <ellipse cx="110" cy="68" rx="22" ry="48" fill="url(#petalGrad)" transform="rotate(45 110 110)" />
                        <ellipse cx="110" cy="68" rx="22" ry="48" fill="url(#petalGrad)" transform="rotate(90 110 110)" />
                        <ellipse cx="110" cy="68" rx="22" ry="48" fill="url(#petalGrad)" transform="rotate(135 110 110)" />
                        <ellipse cx="110" cy="68" rx="22" ry="48" fill="url(#petalGrad)" transform="rotate(180 110 110)" />
                        <ellipse cx="110" cy="68" rx="22" ry="48" fill="url(#petalGrad)" transform="rotate(225 110 110)" />
                        <ellipse cx="110" cy="68" rx="22" ry="48" fill="url(#petalGrad)" transform="rotate(270 110 110)" />
                        <ellipse cx="110" cy="68" rx="22" ry="48" fill="url(#petalGrad)" transform="rotate(315 110 110)" />
                    </g>

                    <circle cx="110" cy="110" r="30" fill="url(#centerGrad)" />
                    <circle cx="110" cy="110" r="24" fill="#FFA500" opacity="0.5" />

                    <g fill="#8B5A00" opacity="0.55">
                        <circle cx="103" cy="103" r="3" />
                        <circle cx="117" cy="103" r="3" />
                        <circle cx="110" cy="117" r="3" />
                        <circle cx="103" cy="117" r="3" />
                        <circle cx="117" cy="117" r="3" />
                        <circle cx="110" cy="96" r="2.5" />
                        <circle cx="96" cy="110" r="2.5" />
                        <circle cx="124" cy="110" r="2.5" />
                        <circle cx="110" cy="124" r="2.5" />
                    </g>

                    <ellipse cx="100" cy="98" rx="8" ry="5" fill="#FFF9C4" opacity="0.55" />
                </g>
            </svg>
        </div>

        <div class="messages" id="messages"></div>
    </div>

    <div class="note">
        <span>✨ Un detalle de mi parte para todas las mujeres que me importan, a mi estilo jsjsjs by:Angelitu :p✨</span>
    </div>

    <script>
        // ============================================================
        // 8 MENSAJES (tal como los ajustaste)
        // ============================================================
        const messages = [
            "🌸 Para todas ustedes: mamá, hermanas, mi amor, amigas... son mi mayor tesoro.",
            "🌻 Mujeres hermosas gracias por ser luz, fuerza y magia en mi vida.",
            "💖 Para las que siempre están su cariño es el regalo más grande que tengo.",
            "🌺 A cada una de ustedes las admiro, las respeto y las quiero con el alma.",
            "🌷 Ustedes son una parte de mi vida muy importante, mi alegría diaria y mi motivo para sonreír.",
            "💐 Hoy 21 de Septiembre celebro a todas las mujeres que hacen mi mundo mejor.",
            "🌼 Que nunca les falten flores amarillas ni razones para sentirse amadas.",
            "✨ Este detalle es para todas ustedes: gracias por siempre estar ahí. Las quiero mucho 💛"
        ];

        // ============================================================
        // 8 FASES DE TRANSICIÓN
        // ============================================================
        const skyColors = [
            "#060b18", "#0c1428", "#1a2440", "#3a4a6a",
            "#7a6a8a", "#c98a7a", "#9ab8d8", "#87ceeb"
        ];

        let phase = 0;
        let msgIndex = 0;

        const flowerBtn = document.getElementById('flowerBtn');
        const messagesArea = document.getElementById('messages');
        const starsContainer = document.getElementById('stars');
        const garden = document.getElementById('garden');
        const bushesContainer = document.getElementById('bushesContainer');
        const grassFront = document.getElementById('grassFront');
        const counter = document.getElementById('counter');
        const body = document.body;

        // 🎵 Referencias de música
        const bgMusic = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');
        const musicIcon = document.getElementById('musicIcon');
        const musicVolume = document.getElementById('musicVolume');

        const isMobile = window.innerWidth < 600 || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

        // ============================================================
        // 🎵 CONTROL DE MÚSICA
        // ============================================================
        let musicPlaying = false;
        let musicStarted = false; // Para saber si ya se inició automáticamente

        const iconPlay = '<path d="M8 5v14l11-7z"/>';
        const iconPause = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';

        bgMusic.volume = 0.5;

        // 🎯 Función para iniciar la música (se llama en el primer clic a la flor)
        function startMusic() {
            if (musicStarted) return; // solo la primera vez
            musicStarted = true;
            bgMusic.play().then(() => {
                musicPlaying = true;
                musicIcon.innerHTML = iconPause;
            }).catch(err => {
                console.log('Error al reproducir música:', err);
            });
        }

        // Botón play/pause manual
        musicBtn.addEventListener('click', () => {
            if (musicPlaying) {
                bgMusic.pause();
                musicPlaying = false;
                musicIcon.innerHTML = iconPlay;
            } else {
                bgMusic.play().then(() => {
                    musicPlaying = true;
                    musicIcon.innerHTML = iconPause;
                }).catch(err => {
                    console.log('Error al reproducir:', err);
                });
            }
        });

        // Control de volumen
        musicVolume.addEventListener('input', (e) => {
            bgMusic.volume = parseFloat(e.target.value);
        });

        // ============================================================
        // ESTRELLAS
        // ============================================================
        const starCount = isMobile ? 60 : 110;
        const starElements = [];
        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            const size = 1 + Math.random() * 2;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 60 + '%';
            star.style.opacity = Math.random() * 0.6 + 0.4;
            if (Math.random() > 0.85) {
                star.style.boxShadow = '0 0 8px rgba(255, 255, 255, 1)';
                star.style.width = '3px';
                star.style.height = '3px';
            }
            starsContainer.appendChild(star);
            starElements.push({
                el: star,
                baseOpacity: parseFloat(star.style.opacity)
            });
        }

        // ============================================================
        // ARBUSTOS
        // ============================================================
        function createBushSVG(variant) {
            const bushes = [
                `<svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
                    <ellipse cx="100" cy="115" rx="95" ry="20" fill="#0d1f12"/>
                    <circle cx="60" cy="85" r="38" fill="#122a18"/>
                    <circle cx="140" cy="85" r="38" fill="#122a18"/>
                    <circle cx="100" cy="70" r="45" fill="#1a3a22"/>
                    <circle cx="75" cy="55" r="28" fill="#1e4528"/>
                    <circle cx="125" cy="55" r="28" fill="#1e4528"/>
                </svg>`,
                `<svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
                    <ellipse cx="100" cy="115" rx="100" ry="18" fill="#0d1f12"/>
                    <ellipse cx="50" cy="88" rx="48" ry="32" fill="#122a18"/>
                    <ellipse cx="150" cy="88" rx="48" ry="32" fill="#122a18"/>
                    <ellipse cx="100" cy="75" rx="60" ry="38" fill="#1a3a22"/>
                    <ellipse cx="70" cy="58" rx="35" ry="25" fill="#1e4528"/>
                    <ellipse cx="130" cy="58" rx="35" ry="25" fill="#1e4528"/>
                </svg>`,
                `<svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
                    <ellipse cx="100" cy="118" rx="98" ry="15" fill="#0d1f12"/>
                    <ellipse cx="55" cy="92" rx="42" ry="28" fill="#122a18"/>
                    <ellipse cx="145" cy="92" rx="42" ry="28" fill="#122a18"/>
                    <ellipse cx="100" cy="78" rx="55" ry="35" fill="#1a3a22"/>
                    <ellipse cx="100" cy="55" rx="45" ry="28" fill="#234f2e"/>
                    <circle cx="75" cy="48" r="20" fill="#2a5c35"/>
                    <circle cx="125" cy="48" r="20" fill="#2a5c35"/>
                </svg>`
            ];
            return bushes[variant % bushes.length];
        }

        function createBushes() {
            const rows = isMobile ? [
                { class: 'bush-mid', count: 3, heightPct: 55, overlap: 0.5 },
                { class: 'bush-front', count: 4, heightPct: 75, overlap: 0.4 }
            ] : [
                { class: 'bush-back', count: 6, heightPct: 50, overlap: 0.4 },
                { class: 'bush-mid', count: 7, heightPct: 65, overlap: 0.35 },
                { class: 'bush-front', count: 8, heightPct: 85, overlap: 0.3 }
            ];

            rows.forEach((row, rowIndex) => {
                const baseWidth = (100 / row.count) * (1 + row.overlap);

                for (let i = 0; i < row.count; i++) {
                    const bush = document.createElement('div');
                    bush.classList.add('bush', row.class);

                    const variant = Math.floor(Math.random() * 3);
                    bush.innerHTML = createBushSVG(variant);

                    const width = baseWidth * (0.9 + Math.random() * 0.3);
                    const height = row.heightPct + Math.random() * 10;

                    bush.style.width = width + '%';
                    bush.style.height = height + '%';

                    const spacing = 100 / row.count;
                    const leftPos = (i * spacing) - (spacing * row.overlap * 0.5);
                    bush.style.left = leftPos + '%';
                    bush.style.bottom = (rowIndex * 2) + '%';

                    bush.style.animationDelay = (Math.random() * 3) + 's';
                    bush.style.animationDuration = (5 + Math.random() * 3) + 's';

                    bushesContainer.appendChild(bush);
                }
            });
        }
        createBushes();

        // ============================================================
        // HIERBA FRONTAL
        // ============================================================
        function createGrassFront() {
            const bladeCount = isMobile ? 25 : 45;
            for (let i = 0; i < bladeCount; i++) {
                const blade = document.createElement('div');
                blade.classList.add('grass-blade');
                const h = 6 + Math.random() * 16;
                blade.style.height = h + 'px';
                blade.style.left = (Math.random() * 100) + '%';
                blade.style.animationDelay = (Math.random() * 4) + 's';
                blade.style.animationDuration = (4 + Math.random() * 3) + 's';
                blade.style.opacity = 0.6 + Math.random() * 0.4;
                blade.style.transform = `rotate(${(Math.random() - 0.5) * 10}deg)`;
                grassFront.appendChild(blade);
            }
        }
        createGrassFront();

        // ============================================================
        // SVG FLOR DEL JARDÍN
        // ============================================================
        function createGardenFlowerSVG() {
            return `
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <radialGradient id="gp" cx="50%" cy="30%" r="70%">
                            <stop offset="0%" stop-color="#FFF3B0"/>
                            <stop offset="50%" stop-color="#FFD966"/>
                            <stop offset="100%" stop-color="#F5B700"/>
                        </radialGradient>
                        <radialGradient id="gc" cx="40%" cy="35%" r="70%">
                            <stop offset="0%" stop-color="#FFE082"/>
                            <stop offset="60%" stop-color="#FFB347"/>
                            <stop offset="100%" stop-color="#C97B00"/>
                        </radialGradient>
                    </defs>
                    <g>
                        <ellipse cx="50" cy="28" rx="11" ry="24" fill="url(#gp)" transform="rotate(0 50 50)"/>
                        <ellipse cx="50" cy="28" rx="11" ry="24" fill="url(#gp)" transform="rotate(60 50 50)"/>
                        <ellipse cx="50" cy="28" rx="11" ry="24" fill="url(#gp)" transform="rotate(120 50 50)"/>
                        <ellipse cx="50" cy="28" rx="11" ry="24" fill="url(#gp)" transform="rotate(180 50 50)"/>
                        <ellipse cx="50" cy="28" rx="11" ry="24" fill="url(#gp)" transform="rotate(240 50 50)"/>
                        <ellipse cx="50" cy="28" rx="11" ry="24" fill="url(#gp)" transform="rotate(300 50 50)"/>
                        <circle cx="50" cy="50" r="15" fill="url(#gc)"/>
                        <circle cx="46" cy="46" r="2" fill="#8B5A00" opacity="0.5"/>
                        <circle cx="54" cy="46" r="2" fill="#8B5A00" opacity="0.5"/>
                        <circle cx="50" cy="54" r="2" fill="#8B5A00" opacity="0.5"/>
                        <ellipse cx="47" cy="45" rx="3" ry="2" fill="#FFF9C4" opacity="0.6"/>
                    </g>
                </svg>
            `;
        }

        // ============================================================
        // POSICIONES DE LAS FLORES
        // ============================================================
        const gardenPositions = [];
        
        const totalFlowers = isMobile ? 14 : 20;
        
        const forbiddenZone = {
            minX: 25, maxX: 75,
            minY: 18, maxY: 68
        };
        
        const cols = isMobile ? 4 : 5;
        const rows = isMobile ? 4 : 5;
        const cellW = 100 / cols;
        const cellH = 92 / rows;
        
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                let x = (c * cellW) + (cellW / 2) + (Math.random() - 0.5) * (cellW * 0.5);
                let y = (r * cellH) + (cellH / 2) + (Math.random() - 0.5) * (cellH * 0.5);
                
                x = Math.max(3, Math.min(96, x));
                y = Math.max(3, Math.min(88, y));
                
                if (x > forbiddenZone.minX && x < forbiddenZone.maxX &&
                    y > forbiddenZone.minY && y < forbiddenZone.maxY) {
                    if (x < 50) {
                        x = Math.max(3, x - 25);
                    } else {
                        x = Math.min(96, x + 25);
                    }
                    if (x > forbiddenZone.minX && x < forbiddenZone.maxX) {
                        if (y < 50) y = Math.max(3, y - 20);
                        else y = Math.min(88, y + 15);
                    }
                }
                
                gardenPositions.push({ x, y });
            }
        }
        
        for (let i = gardenPositions.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [gardenPositions[i], gardenPositions[j]] = [gardenPositions[j], gardenPositions[i]];
        }

        let gardenIndex = 0;

        // ============================================================
        // APARECER FLOR EN EL JARDÍN
        // ============================================================
        function bloomGardenFlower() {
            if (gardenIndex >= gardenPositions.length) return;

            const pos = gardenPositions[gardenIndex];
            gardenIndex++;

            const flower = document.createElement('div');
            flower.classList.add('garden-flower', 'swaying');
            flower.innerHTML = createGardenFlowerSVG();

            const distanceFromBottom = 100 - pos.y;
            const baseSize = isMobile ? 20 : 28;
            const maxExtra = isMobile ? 16 : 22;
            const sizeFactor = distanceFromBottom / 100;
            const size = baseSize + (maxExtra * sizeFactor) + (Math.random() * 6 - 3);
            
            flower.style.width = size + 'px';
            flower.style.height = size + 'px';

            const offsetX = (Math.random() - 0.5) * 1.5;
            const offsetY = (Math.random() - 0.5) * 1.5;
            flower.style.left = (pos.x + offsetX) + '%';
            flower.style.top = (pos.y + offsetY) + '%';

            flower.style.animationDelay = (Math.random() * 0.2) + 's, ' + (1 + Math.random() * 2) + 's';
            flower.style.animationDuration = '1s, ' + (3.5 + Math.random() * 2.5) + 's';

            garden.appendChild(flower);
        }

        // ============================================================
        // ACTUALIZAR FONDO Y ESTRELLAS
        // ============================================================
        function updateSky() {
            body.style.background = skyColors[phase];
            
            const starOpacity = Math.max(0, 1 - (phase / 7) * 1.2);
            
            starElements.forEach(item => {
                item.el.style.opacity = item.baseOpacity * starOpacity;
            });
            
            if (phase >= 7) {
                starsContainer.style.opacity = 0;
            } else {
                starsContainer.style.opacity = 1;
            }

            if (phase === 7) {
                body.classList.add('day');
            }
        }

        // ============================================================
        // MOSTRAR MENSAJE (los 8 se quedan cargados)
        // ============================================================
        function showMessage() {
            if (msgIndex >= messages.length) return;

            const div = document.createElement('div');
            div.classList.add('message');
            div.textContent = messages[msgIndex];
            messagesArea.appendChild(div);
            msgIndex++;

            setTimeout(() => {
                messagesArea.scrollTop = messagesArea.scrollHeight;
            }, 100);
        }

        // ============================================================
        // CONTADOR (llega hasta 8/8)
        // ============================================================
        function updateCounter() {
            counter.textContent = `💛 ${phase} / 8`;
        }

        // ============================================================
        // CLICK EN LA FLOR
        // ============================================================
        flowerBtn.addEventListener('click', () => {
            // 🎵 Iniciar música en el primer clic (autoreproducción)
            startMusic();

            // 🎯 Animación: giro leve + rebote (siempre)
            flowerBtn.classList.remove('pop');
            void flowerBtn.offsetWidth;
            flowerBtn.classList.add('pop');
            setTimeout(() => flowerBtn.classList.remove('pop'), 750);

            // Si ya terminó el amanecer, solo se anima pero no avanza
            if (phase >= 8) return;

            phase++;
            updateSky();
            showMessage();
            updateCounter();

            const flowersPerClick = isMobile ? 2 : 3;
            for (let i = 0; i < flowersPerClick; i++) {
                setTimeout(() => bloomGardenFlower(), i * 120);
            }

            if (navigator.vibrate) navigator.vibrate(15);
        });

        // ============================================================
        // INICIALIZAR
        // ============================================================
        updateSky();
        updateCounter();
    </script>
</body>
</html>
